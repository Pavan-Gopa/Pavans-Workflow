modelRoleStorage: project

modelRoles:
  # Main has one editable model slot: DEFAULT. workflow_orchestrator is a
  # managed alias used by launch/cycle commands and is hidden from Alt+M Roles.
  workflow_orchestrator: "@default"
  workflow_coder: openai-codex/gpt-5.6-luna:max
  # Fast first-attempt Coder (3.7). Pick a fast model in Alt+M -> Roles to enable it;
  # while it aliases the Coder, workflow_route.py sends every step to workflow-coder.
  workflow_coder_fast: "@workflow_coder"
  workflow_reviewer: google-antigravity/gemini-3.6-flash:high
  workflow_tester: openai-codex/gpt-5.6-terra:max
  workflow_architect: openai-codex/gpt-5.6-sol:xhigh
  workflow_security: nvidia/z-ai/glm-5.2:max
  # Optional design escalation. Reassign Designer to Kimi or another strong
  # visual model through Alt+M -> Roles without changing agent prompts.
  workflow_design_advisor: "@workflow_reviewer"
  workflow_designer: "@workflow_architect"
  workflow_orchestrator_backup: google-antigravity/gemini-3.6-flash:high
  workflow_coder_backup: nvidia/z-ai/glm-5.2:high
  workflow_reviewer_backup: openai-codex/gpt-5.6-sol:high
  workflow_tester_backup: google-antigravity/gemini-3.6-flash:high
  workflow_architect_backup: google-antigravity/gemini-3.6-flash:high
  workflow_security_backup: openai-codex/gpt-5.6-sol:max
  workflow_design_advisor_backup: "@workflow_reviewer_backup"
  workflow_designer_backup: "@workflow_architect_backup"

modelTags:
  workflow_orchestrator:
    name: Main Orchestrator (managed by DEFAULT)
    hidden: true

retry:
  enabled: true
  # Primary worker model/provider failure: Main dispatches the -backup worker
  # automatically (R16). In-session fallback stays off so R17 checks always apply.
  modelFallback: false
  maxRetries: 3

async:
  enabled: true

task:
  batch: true
  enableLsp: true
  maxConcurrency: 1
  maxRecursionDepth: 1
  # Long repository work may legitimately need hours. The Human can still abort
  # a stalled worker explicitly from Agent Hub; OMP retains a four-hour hard wall.
  maxRuntimeMs: 14400000
  # Disable OMP's request-count forced-yield guard for workflow roles. The
  # file-backed workflow has its own retry/stall controls, and the four-hour
  # wall-clock ceiling remains the terminal runaway guard.
  softRequestBudget: 0
  showResolvedModelBadge: true

skills:
  enabled: true
  enableSkillCommands: true
  customDirectories:
    - .

cycleOrder:
  - workflow_orchestrator
  - workflow_orchestrator_backup

contextPromotion:
  enabled: false

compaction:
  enabled: true
  thresholdPercent: 28
  thresholdTokens: -1
  midTurnEnabled: true
  autoContinue: true
  idleEnabled: false
  asyncEnabled: false
  methodOrder:
    - shake
    - soft
  remoteEnabled: false
  supersedeReads: true
  dropUseless: true
